name: guardtab

services:

  postgres:
    image: postgres:16-alpine
    container_name: guardtab-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: guardtab
      POSTGRES_PASSWORD: guardtab_dev_password
      POSTGRES_DB: guardtab

    ports:
      - "5433:5432"

    volumes:
      - guardtab_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardtab -d guardtab"]
      interval: 5s
      timeout: 5s
      retries: 10

    backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: guardtab-backend
    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql://guardtab:guardtab_dev_password@postgres:5432/guardtab

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  guardtab_postgres_data:
  # guardtab_redis_data:
